name: dimelo-formatting
on: [ pull_request ]
jobs:
  ruff-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: chartboost/ruff-action@v3
  # TODO: Is it really necessary for these to be separate jobs? This seems redundant.
  ruff-format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: chartboost/ruff-action@v3
        with:
          args: 'format --check'
